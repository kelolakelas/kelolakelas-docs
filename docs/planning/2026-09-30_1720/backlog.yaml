      "draftKey": "attendance-by-session",
      "projectKey": "tutor-session-operations",
      "title": "Absensi dapat dicatat per sesi, termasuk sesi reschedule dan secara massal",
      "type": "Improvement",
      "priority": "High",
      "estimate": "M",
      "complexity": "high",
      "labels": ["academic", "ai-ready"],
