  - projectKey: tenant-parent-teacher-chat
    type: Feature
    priority: High
    externalDependencies: []
    draftKey: chat-service-websocket-realtime
    title: Chat-service mengirim pesan baru secara realtime lewat WebSocket dengan tiket sekali pakai
    estimate: L
    complexity: high
    repositories:
      - chat
    blockedByDraftKeys:
      - chat-service-core-api
      - chat-service-conversation-contexts
    body:
      backgroundProblem: Owner memutuskan pesan baru muncul lewat WebSocket sejak awal. Web memanggil backend hanya dari server (`kelolakelas-web/lib/gateway.ts:148-176`, kelolakelas-docs `docs/components/web.md:60-64`) dan menyimpan JWT di cookie `httpOnly` (`app/(auth)/login/_actions/actions.ts:73-74`). Akibatnya browser tidak dapat mengirim header `Authorization` saat membuka WebSocket. Belum ada library WebSocket di repo Go mana pun.
      goal: Klien terautentikasi dapat membuka WebSocket dengan tiket sekali pakai dan menerima event pesan baru serta status baca untuk percakapan yang boleh dilihatnya, tanpa polling.
      requirements:
        - "`POST /api/v1/chat/ws-tickets` (JWT wajib) mengembalikan `ticket` acak minimal 32 byte dan `expires_at`. Tiket berlaku paling lama 60 detik, sekali pakai, hanya disimpan sebagai hash, dan terikat ke `user_id`, `tenant_id`, `role_id`, `member_id`, `is_parent`, serta `exp` token."
        - "`GET /api/v1/chat/ws?ticket=` melakukan upgrade WebSocket hanya bila tiket valid, belum dipakai, dan belum kedaluwarsa. Selain itu request ditolak 401 sebelum upgrade."
        - Server mengirim event JSON `message.created` (`conversation_id` dan pesan) dan `conversation.read` (`conversation_id`, `user_id`, penanda baca) hanya ke koneksi yang lolos fungsi visibilitas yang sama dengan REST.
        - Pesan tetap dikirim lewat REST; selain ping/pong, WebSocket hanya berarah dari server ke klien.
        - Ping dikirim setiap 30 detik. Koneksi ditutup bila pong tidak diterima dalam dua interval, saat `exp` token tercapai, atau setelah umur koneksi 30 menit (klien lalu meminta tiket baru). Hak `chat:manage`/`report:read` koneksi dievaluasi saat terhubung.
        - Ada batas ukuran frame dari klien (mis. 4 KB) dan batas jumlah koneksi per pengguna (mis. 5) untuk mencegah penyalahgunaan.
        - Fan-out memakai hub di memori untuk satu instance, dan shutdown menutup koneksi dengan close code normal.
      acceptanceCriteria:
        - Klien dengan tiket valid menerima `message.created` untuk pesan yang dikirim peserta lain lewat REST, tanpa reload.
        - Klien yang tidak berhak melihat percakapan, termasuk anggota tenant lain dan parent lain, tidak menerima event-nya.
        - Tiket kedaluwarsa, sudah dipakai, atau acak ditolak 401 tanpa upgrade.
        - Koneksi ditutup saat token kedaluwarsa atau setelah batas umur koneksi tercapai.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: |-
        Risiko utama: autentikasi WebSocket dan kebocoran event. Mitigasinya:
        - tiket sekali pakai berumur pendek, dan JWT tidak pernah dikirim lewat query;
        - tiket disimpan sebagai hash;
        - fan-out lewat fungsi visibilitas tunggal.

        Pilih library WebSocket Go yang aktif dipelihara dan lolos govulncheck, lalu catat alasannya di ADR. Gateway meneruskan upgrade dan menegakkan Origin lewat `CORSMiddleware` (api-gateway `internal/delivery/http/router.go:76`). Access log gateway hanya mencatat path tanpa query (`internal/delivery/http/middleware/access_log_middleware.go:35-40`), sehingga tiket tidak tercatat.

        Asumsi: chat-service berjalan satu instance. Fan-out multi-instance (mis. PostgreSQL LISTEN/NOTIFY) di luar scope dan dicatat sebagai risiko.

        Perbarui kelolakelas-docs: `docs/api/chat.md` (protokol event), `docs/components/chat-service.md`, dan ADR baru untuk autentikasi WebSocket berbasis tiket.
      relevantAreas:
        - kelolakelas-chat-service/cmd/server
        - kelolakelas-chat-service/internal/delivery
        - kelolakelas-chat-service/internal/usecase
        - kelolakelas-chat-service/migrations
      edgeCases:
        - Tiket yang sama dipakai dua kali bersamaan; hanya satu yang berhasil.
        - Klien lambat yang buffer kirimnya penuh diputus agar tidak memblokir hub.
        - Permission dicabut saat koneksi masih terbuka; perubahan berlaku paling lambat saat batas umur koneksi.
        - Pengguna membuka beberapa tab.
      testingValidation:
        - Unit test tiket (kedaluwarsa, sekali pakai, hash) dan hub (fan-out hanya ke koneksi yang berhak).
        - Integration test WebSocket dengan `httptest` untuk upgrade, event, isolasi tenant/parent sebagai mitigasi kebocoran, dan penutupan saat token kedaluwarsa.
        - Test race untuk pemakaian tiket bersamaan dengan `go test -race`.
        - CI `gate` pass (`gofmt`, `go vet`, `go test -race`, build, govulncheck), existing tests pass, dan acceptance criteria diverifikasi.
      outOfScope:
        - Mengirim pesan lewat WebSocket.
        - Fan-out multi-instance.
        - Indikator mengetik dan status online.
        - Route gateway (issue terpisah).
    labels:
      - chat
      - ai-ready
  - projectKey: tenant-parent-teacher-chat
    type: Feature
    priority: High
    externalDependencies: []
    draftKey: gateway-chat-routes
    title: Gateway meneruskan REST chat dan koneksi WebSocket chat ke chat-service
    estimate: M
    complexity: high
    repositories:
      - api-gateway
    blockedByDraftKeys:
      - chat-service-core-api
      - chat-service-websocket-realtime
    body:
      backgroundProblem: Gateway saat ini hanya mengenal tiga upstream (`internal/config/config.go:58-60`, `internal/delivery/http/handler/proxy_handler.go:47-83`). Setiap proxy dibatasi `context.WithTimeout` selama `PROXY_UPSTREAM_TIMEOUT_SECONDS` (default 30 detik) untuk seluruh pertukaran (`proxy_handler.go:115-138`). `httputil.ReverseProxy` meneruskan upgrade WebSocket dan menutup koneksi backend ketika context request selesai, sehingga route WebSocket yang melewati `proxyRoute` akan terputus setelah 30 detik. Sebaliknya, hijack koneksi menghapus deadline server (Go `net/http/server.go:325`), jadi `SERVER_WRITE_TIMEOUT_SECONDS` tidak memutus koneksi yang sudah di-upgrade. Kesimpulan ini Inferred dari source stdlib dan harus dibuktikan lewat test.
      goal: Web dapat memanggil REST chat lewat gateway dengan autentikasi dan session check yang sama seperti route lain, serta membuka WebSocket chat yang bertahan melewati batas timeout proxy.
      requirements:
        - Env baru `CHAT_SERVICE_URL` bersifat opsional. Bila kosong, semua route chat menjawab 503 dengan envelope gateway dan readiness tidak memeriksa chat. Bila diisi, readiness (`internal/delivery/http/readiness.go`) ikut memeriksa chat-service.
        - Route REST chat (`/api/v1/chat/conversations`, `/api/v1/chat/conversations/:id`, `/:id/messages`, `/:id/read`, dan `POST /api/v1/chat/ws-tickets`) didaftarkan di grup protected dengan `AuthMiddlewareWithSessionCheck`. Route ini dapat diakses parent maupun anggota tenant dan memakai `proxyRoute` biasa.
        - "`GET /api/v1/chat/ws` didaftarkan tanpa `Authorization`, karena chat-service yang memvalidasi tiket. Route ini memakai reverse proxy terpisah tanpa deadline upstream, tetapi tetap melewati `CORSMiddleware` dan rate limit global."
        - Header konteks yang tidak tepercaya tetap dihapus (`StripUntrustedContextHeaders`) pada route chat.
        - Signature `NewProxyHandler` yang dipakai test lama tetap dapat dikompilasi; upstream chat ditambahkan lewat opsi atau field baru.
      acceptanceCriteria:
        - REST chat tanpa token ditolak 401 oleh gateway, sedangkan dengan token valid diteruskan ke chat-service.
        - Dalam test dengan timeout diperkecil, upgrade WebSocket dengan Origin sama dengan `APP_URL` berhasil dan tetap terhubung lebih lama dari `PROXY_UPSTREAM_TIMEOUT_SECONDS`.
        - Upgrade dengan Origin lain ditolak 403 sebelum mencapai chat-service.
        - Tanpa `CHAT_SERVICE_URL`, route chat menjawab 503 dan route lain tidak berubah.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: |-
        Risiko utama: route WebSocket ini tidak diautentikasi gateway dan tidak punya batas waktu. Mitigasinya:
        - autentikasi tiket di chat-service;
        - Origin ditegakkan `CORSMiddleware` (`internal/delivery/http/router.go:76`);
        - rate limit global;
        - batas umur koneksi di chat-service;
        - access log yang tidak mencatat query.

        `http.Server.Shutdown` tidak menutup koneksi yang sudah di-hijack, jadi pastikan shutdown gateway tidak tertahan oleh koneksi WebSocket. Path mengikuti kontrak issue `chat-service-core-api` dan `chat-service-websocket-realtime`.

        Perbarui kelolakelas-docs: `docs/api/gateway.md`, `docs/api/endpoint-matrix.md`, `docs/components/api-gateway.md`, dan `docs/reference/environment-variables.md`, serta tambahkan ADR yang mencatat pengecualian WebSocket terhadap ADR 0021 (bounded proxy).
      relevantAreas:
        - kelolakelas-api-gateway/internal/config/config.go
        - kelolakelas-api-gateway/internal/delivery/http/router.go
        - kelolakelas-api-gateway/internal/delivery/http/handler/proxy_handler.go
        - kelolakelas-api-gateway/internal/delivery/http/readiness.go
        - kelolakelas-api-gateway/cmd/server/main.go
        - kelolakelas-api-gateway/.env.example
      edgeCases:
        - Chat-service tidak tersedia saat upgrade; dijawab 502 dengan envelope gateway.
        - Gateway shutdown saat koneksi WebSocket masih terbuka.
        - Body REST chat melebihi `PROXY_MAX_BODY_BYTES` dijawab 413.
      testingValidation:
        - Router test bahwa setiap route chat diteruskan ke upstream chat dan route REST terlindungi.
        - Test WebSocket end-to-end dengan upstream echo `httptest` yang membuktikan koneksi bertahan melewati timeout upstream yang diperkecil, sebagai mitigasi risiko timeout.
        - Test bahwa Origin asing ditolak dan `CHAT_SERVICE_URL` kosong menghasilkan 503.
        - Existing tests pass, `gofmt`/`go vet`/`go test -race` pass, dan acceptance criteria diverifikasi.
      outOfScope:
        - Autentikasi tiket (di chat-service).
        - Rate limit khusus chat.
        - Load balancing multi-instance.
    labels:
      - api-gateway
      - ai-ready
  - projectKey: tenant-parent-teacher-chat
    type: Feature
    priority: High
    externalDependencies: []
    draftKey: web-chat-inbox-realtime
    title: Parent dan anggota tenant membaca dan membalas chat di web dengan pesan baru muncul realtime
    estimate: L
    complexity: medium
    repositories:
      - web
    blockedByDraftKeys:
      - gateway-chat-routes
    body:
      backgroundProblem: Web belum memiliki halaman chat maupun library WebSocket. Semua panggilan backend berjalan di Server Actions/Components ke `GATEWAY_API_URL`, yang sengaja server-only (`lib/gateway.ts:148-176`, kelolakelas-docs `docs/components/web.md:60-64`). Satu-satunya pola pembaruan berkala saat ini adalah `PaymentReturnRefresher` (`router.refresh()`). Navigasi tenant didefinisikan di `app/(dashboard)/dashboard/tenant/_constants/constants.ts`, dan halaman parent ada di `app/(dashboard)/dashboard/parent/{students,enrollments}`.
      goal: Parent dan anggota tenant dapat melihat daftar percakapan, membuka percakapan, mengirim pesan, dan melihat pesan baru tanpa reload.
      requirements:
        - Halaman `/dashboard/parent/chat` dan `/dashboard/tenant/chat` menampilkan daftar percakapan (jenis, konteks snapshot, pesan terakhir, jumlah belum dibaca) dan panel percakapan yang dipilih.
        - Pesan dikirim lewat Server Action ke `POST /api/v1/chat/conversations/:id/messages` dengan `client_message_id` yang dibuat klien. Pesan tampil optimis, lalu dikonfirmasi atau ditandai gagal dengan opsi kirim ulang.
        - Membuka percakapan memanggil `POST /api/v1/chat/conversations/:id/read`.
        - Anggota tenant dapat memulai percakapan dengan admin tenant (`kind` `staff`) dari halaman chat tenant.
        - "Realtime berjalan begini: Server Action meminta tiket (`POST /api/v1/chat/ws-tickets`) memakai cookie auth, lalu komponen klien membuka WebSocket ke env publik baru `NEXT_PUBLIC_CHAT_WS_URL` (origin ws/wss gateway) + `/api/v1/chat/ws?ticket=`. Event `message.created` dan `conversation.read` memperbarui daftar dan panel."
        - Saat koneksi putus atau ditutup server, klien reconnect dengan backoff dan tiket baru, lalu mengambil ulang pesan yang terlewat. Bila `NEXT_PUBLIC_CHAT_WS_URL` kosong atau koneksi gagal, halaman tetap berfungsi dengan refresh manual dan menampilkan status koneksi.
        - Tautan ke chat ditambahkan di navigasi tenant dan di halaman parent yang sudah ada.
        - Isi pesan dirender sebagai teks biasa tanpa HTML, dengan pemisah baris dipertahankan.
      acceptanceCriteria:
        - Parent dan admin tenant di dua browser melihat pesan satu sama lain muncul tanpa reload.
        - Anggota tenant memulai percakapan dengan admin tenant, dan admin melihatnya di daftar.
        - Pesan yang gagal terkirim ditandai dan dapat dikirim ulang tanpa duplikasi.
        - Saat WebSocket tidak tersedia, halaman menampilkan status terputus dan tetap dapat mengirim serta memuat pesan.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: 'Sesuai keputusan owner, realtime memakai WebSocket sejak awal. `NEXT_PUBLIC_CHAT_WS_URL` sengaja membuka origin WebSocket gateway ke browser, sebagai pengecualian dari prinsip gateway server-only; JWT tetap tidak pernah dikirim ke browser, hanya tiket sekali pakai. Saat ini tidak ada CSP di `next.config.ts`. Error 404 dari chat ditampilkan sebagai "Percakapan tidak ditemukan". Nama tampilan pengirim di luar scope: tampilkan "Anda", "Tenant", "Pengajar", atau "Parent" berdasarkan `sender_kind` dan jenis percakapan. Perbarui `.env.example` web, serta kelolakelas-docs `docs/components/web.md` dan `docs/reference/environment-variables.md`.'
      relevantAreas:
        - kelolakelas-web/app/(dashboard)/dashboard/parent
        - kelolakelas-web/app/(dashboard)/dashboard/tenant
        - kelolakelas-web/app/(dashboard)/dashboard/tenant/_constants/constants.ts
        - kelolakelas-web/lib/gateway.ts
        - kelolakelas-web/.env.example
      edgeCases:
        - Tiket kedaluwarsa sebelum koneksi dibuka; klien meminta tiket baru sekali.
        - Event datang untuk percakapan yang belum ada di daftar; daftar dimuat ulang.
        - Beberapa tab terbuka.
        - Pesan panjang dan multi-baris.
        - Cookie sesi kedaluwarsa saat meminta tiket; pengguna diarahkan ke login seperti di halaman lain.
      testingValidation:
        - "Vitest untuk state chat: penerapan event, optimistic update, dan dedup `client_message_id`."
        - Test komponen untuk status koneksi dan fallback tanpa WebSocket.
        - Test Server Actions untuk pemetaan error 401, 404, dan 400.
        - Existing tests pass, `npm run lint` pass, type check/`next build` pass, dan acceptance criteria diverifikasi manual.
      outOfScope:
        - Tombol memulai chat dari permintaan jadwal dan report (issue terpisah).
        - Notifikasi di luar halaman chat.
        - Lampiran dan nama tampilan pengirim.
    labels:
      - web
      - ai-ready
