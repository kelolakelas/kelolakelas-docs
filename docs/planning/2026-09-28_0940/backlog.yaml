schemaVersion: kelolakelas.planning-backlog/v1
projects:
  - key: tenant-parent-teacher-chat
    name: Chat realtime antara tenant, pengajar, dan parent
    outcome: Parent dapat berdiskusi dengan admin tenant tentang permintaan jadwal private, pengajar dapat berdiskusi dengan admin tenant, dan pengajar dapat berdiskusi dengan parent tentang report student. Pesan baru muncul realtime melalui WebSocket.
    problem: "Belum ada kanal komunikasi di dalam KelolaKelas: tidak ada kode chat, WebSocket, atau notifikasi di repo mana pun. Web tidak memiliki library WebSocket/SSE, dan gateway memutus setiap proxy setelah `PROXY_UPSTREAM_TIMEOUT_SECONDS` (default 30 detik, api-gateway `internal/delivery/http/handler/proxy_handler.go:115-138`). Alur permintaan jadwal private bergantung pada komunikasi di luar aplikasi, dan report student hanya dapat dibaca anggota tenant (academic `cmd/server/attendance_report_routes.go:17-21`)."
    valueAndPriority: High. Permintaan owner yang melengkapi alur jadwal private dan komunikasi report. Confidence sedang karena ini service baru tanpa preseden realtime di codebase. Effort total besar (3 issue L, 4 issue M, 1 issue S).
    scope:
      - Repo dan service baru `kelolakelas-chat-service` (Go, PostgreSQL sendiri) untuk percakapan dan pesan.
      - Permission tenant baru `chat:manage` di identity untuk admin tenant yang menangani chat.
      - Endpoint internal academic yang menyediakan konteks permintaan jadwal private dan report untuk pemeriksaan hak akses chat-service.
      - "Tiga jenis percakapan: parent–admin tenant per permintaan jadwal private, pengajar–admin tenant, dan pengajar–parent per report student."
      - Pengiriman pesan lewat REST dan penerimaan realtime lewat WebSocket dengan tiket sekali pakai.
      - Route REST dan WebSocket chat di api-gateway.
      - Halaman chat parent dan tenant di web beserta titik masuk dari permintaan jadwal dan report.
    outOfScope:
      - Lampiran file atau gambar, edit dan hapus pesan, reaksi, indikator mengetik, dan status online.
      - Notifikasi email, push, atau badge di luar halaman chat.
      - Fan-out lintas beberapa instance chat-service; tahap ini satu instance.
      - Chat antar-parent, atau chat parent langsung ke pengajar di luar konteks report.
      - Moderasi, pemblokiran pengguna, serta retensi dan penghapusan otomatis pesan.
      - Manifest deployment, yang belum ada untuk service mana pun.
    successMetrics:
      - Parent pemilik permintaan jadwal private dan admin tenant dapat bertukar pesan di percakapan permintaan itu, dan pesan muncul di sisi lain tanpa reload.
      - Pengajar dapat memulai percakapan dengan admin tenant, dan dapat memulai percakapan dengan parent dari sebuah report.
      - Tidak ada percakapan atau pesan yang dapat dibaca lintas tenant, lintas parent, atau oleh anggota tanpa permission, dibuktikan test isolasi di chat-service dan gateway.
      - Koneksi WebSocket lewat gateway bertahan melewati `PROXY_UPSTREAM_TIMEOUT_SECONDS`.
    dependenciesAndRisks:
      - "Prasyarat operator sebelum issue mana pun diberi `ai-ready`: repo `kelolakelas/kelolakelas-chat-service` (public, kerangka Go, CI `gate`, branch protection sama dengan repo lain), `chat` ditambahkan ke `repositoryNames` kontrak orchestrator, tooling planning/autopilot disinkronkan, dan label Linear `chat` dibuat."
      - "Risiko utama: kebocoran pesan lintas tenant atau lintas parent di service baru. Mitigasinya satu fungsi visibilitas yang dipakai REST dan fan-out WebSocket, ditambah test isolasi."
      - "Risiko autentikasi WebSocket: browser tidak dapat mengirim JWT karena cookie `httpOnly` dan semua request web berjalan dari server ke `GATEWAY_API_URL`. Karena itu dipakai tiket sekali pakai berumur pendek."
      - Titik masuk chat dari halaman permintaan jadwal bergantung pada KEL-109 dan KEL-110.
  - key: private-class-scheduled-purchase
    name: Pembelian kelas private dengan jadwal yang disepakati
    outcome: Parent dapat mengajukan jadwal kelas private, tenant meninjau lalu menyetujui, menolak, atau menolak dengan rekomendasi jadwal lain, lalu parent membayar melalui payment link sehingga enrollment aktif dengan jadwal yang disepakati.
    problem: Kelas private kini dibeli langsung tanpa jadwal (academic `internal/usecase/enrollment_usecase.go:168,217`). Jadwal private hanya dapat dibuat tenant melalui `POST /schedules` dengan `enrollment_id` setelah enrollment ada (`internal/usecase/schedule_usecase.go:221-239`), dan tidak ada UI untuk itu. Akibatnya kelas private terjual tanpa jadwal yang disepakati.
    valueAndPriority: High. Kelas private adalah produk inti bimbel. Confidence tinggi karena alur memakai ulang enrollment, invoice billing, aktivasi internal, dan generator sesi yang sudah ada. Effort total L.
    scope:
      - Resource permintaan jadwal private di academic beserta route gateway.
      - Form permintaan jadwal dan status permintaan untuk parent di web.
      - Persetujuan tenant yang membuat enrollment, jadwal private, dan invoice.
      - Halaman tenant untuk meninjau, menyetujui, dan menolak permintaan.
      - Penolakan dengan rekomendasi jadwal lain dan penerimaan rekomendasi oleh parent.
    outOfScope:
      - Chat tenant–parent (menunggu keputusan arsitektur).
      - Pengiriman payment link lewat email atas permintaan tenant (kandidat run berikutnya).
      - Negosiasi bolak-balik di luar rekomendasi tenant dan pengajuan ulang oleh parent.
      - Halaman pembayaran tanpa redirect ke Duitku.
    successMetrics:
      - Kelas private hanya dapat dibeli melalui permintaan jadwal yang disetujui tenant.
      - Setiap enrollment private yang dibayar memiliki jadwal aktif yang sama dengan slot yang disetujui dan sesi yang dihasilkan.
      - Tidak ada permintaan atau enrollment yang dapat diakses lintas tenant atau lintas parent (dibuktikan test isolasi).
    dependenciesAndRisks:
      - Invoice memakai `GenerateInvoice` billing yang ada (academic `pkg/billing/client.go`); tidak ada perubahan billing.
      - Risiko utama adalah idempotensi persetujuan dan kebocoran data lintas tenant.
issues:
  - projectKey: tenant-parent-teacher-chat
    type: Feature
    priority: High
    externalDependencies: []
    draftKey: chat-manage-permission
    title: Identity menyediakan permission tenant `chat:manage` untuk admin yang menangani chat
    estimate: S
    complexity: medium
    repositories:
      - identity
    blockedByDraftKeys: []
    body:
      backgroundProblem: Chat membutuhkan cara menentukan siapa admin tenant yang menangani percakapan dengan parent dan pengajar. Katalog permission disimpan di tabel `permissions` dengan `name` unik (`migrations/00000000000000_init_schema.up.sql:29-30`) dan diisi oleh `seeders/000001_default_permissions_and_roles.sql`. Role sistem `Creator` hanya mendapat semua permission saat seed dijalankan (`seeders/000001_default_permissions_and_roles.sql:65-70`), sehingga permission baru tidak otomatis dimiliki tenant yang sudah ada. Role `Teacher` hanya memiliki permission `schedule`, `attendance`, `student_note`, dan `report` (`:72-79`).
      goal: Permission `chat:manage` tersedia di semua lingkungan, dimiliki role sistem `Creator`, dan dapat diberikan ke role kustom lewat editor role yang sudah ada.
      requirements:
        - Migration identity baru menambahkan permission `chat:manage` dengan deskripsi Bahasa Indonesia (mis. "Menangani chat tenant dengan parent dan pengajar") secara idempoten (`ON CONFLICT (name) DO NOTHING`).
        - Migration yang sama memberikan `chat:manage` ke role sistem `Creator` (`tenant_id IS NULL`) secara idempoten, dan tidak memberikannya ke `Teacher`.
        - Seeder default diperbarui sehingga database baru mendapat permission dan grant yang sama.
        - Down migration menghapus grant `chat:manage`, lalu permission-nya.
        - "`CheckPermission` gRPC (`internal/delivery/grpc/permission_service.go:88`) menjawab `chat:manage` hanya dari data, tanpa perubahan kode."
      acceptanceCriteria:
        - Setelah migrate up, `GET /api/v1/permissions` memuat `chat:manage`.
        - Anggota dengan role `Creator` mendapat `true` dari `CheckPermission` untuk `chat:manage`, sedangkan anggota dengan role `Teacher` mendapat `false`.
        - Menjalankan migrate up dua kali, atau seed setelah migrate, tidak menghasilkan duplikat.
        - Migrate down lalu up kembali berhasil.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: "Nama `chat:manage` dipakai chat-service (issue `chat-service-core-api`) untuk menentukan admin tenant, jadi jangan diganti tanpa memperbarui issue itu. Ikuti pola migration terbaru (`migrations/000013_platform_fee_policy.*.sql`). Permission baru otomatis tampil di editor role karena katalog dibaca dari database (`internal/repository/rbac_repository.go:22`, `GET /api/v1/permissions`). Asumsi yang belum dikonfirmasi owner: admin tenant adalah pemegang `chat:manage`, dan owner dapat memberikannya ke role kustom lewat editor role. Perbarui kelolakelas-docs `docs/data/identity-schema.md` dan daftar permission di `docs/05-security.md` bila ada."
      relevantAreas:
        - kelolakelas-identity-service/migrations
        - kelolakelas-identity-service/seeders/000001_default_permissions_and_roles.sql
        - kelolakelas-identity-service/internal/delivery/grpc/permission_service.go
        - kelolakelas-identity-service/internal/repository/rbac_repository.go
      edgeCases:
        - Database yang sudah memiliki permission `chat:manage` dari seed manual.
        - Role `Creator` belum ada karena database belum diseed.
        - Role kustom tenant yang meniru `Creator` tidak otomatis mendapat permission baru.
      testingValidation:
        - Test migration di PostgreSQL untuk up, up ulang, down, dan grant yang hanya ke `Creator`. Bila repo belum punya pola test migration, verifikasi manual di PostgreSQL lokal dan catat hasilnya di PR.
        - Test `CheckPermission` untuk `Creator` dan `Teacher`.
        - Existing tests pass, `gofmt`/`go vet` pass, dan acceptance criteria diverifikasi.
      outOfScope:
        - Pemakaian permission di service lain.
        - UI khusus di luar editor role yang sudah ada.
        - Memberikan permission ke role kustom yang sudah ada.
    labels:
      - identity
      - ai-ready
  - projectKey: tenant-parent-teacher-chat
    type: Feature
    priority: High
    externalDependencies: []
    draftKey: academic-chat-context-internal-api
    title: Academic menyediakan konteks permintaan jadwal private dan report untuk chat-service melalui endpoint internal
    estimate: M
    complexity: high
    repositories:
      - academic
    blockedByDraftKeys: []
    body:
      backgroundProblem: |-
        Chat-service harus memastikan parent hanya membuka percakapan untuk permintaan jadwal miliknya, dan pengajar hanya membuka percakapan report di tenant-nya. Datanya hanya ada di academic:
        - permintaan jadwal private (`internal/domain/private_schedule_request.go`: `tenant_id`, `parent_id`, `class_id`, `student_id`, `status`);
        - report (`internal/domain/report.go`: `TenantID`, `EnrollmentID`, `ReporterID`);
        - relasi enrollment ke student (`internal/domain/enrollment.go:54`) dan pemilik student (`internal/domain/student.go:22` `ParentID`).

        Endpoint publik report hanya untuk anggota tenant (`cmd/server/attendance_report_routes.go:17-21`). Academic sudah memiliki grup internal ber-`InternalServiceAuth` (`cmd/server/routes.go:99-102`, header `X-Internal-Service-Credential`).
      goal: Chat-service dapat mengambil konteks minimal satu permintaan jadwal private atau satu report lewat endpoint internal yang dilindungi credential, tanpa membuka data tersebut ke publik.
      requirements:
        - "`GET /internal/chat-context/schedule-requests/:id` mengembalikan `id`, `tenant_id`, `parent_id`, `class_id`, `class_name`, `student_id`, `student_first_name`, dan `status`."
        - "`GET /internal/chat-context/reports/:id` mengembalikan `id`, `tenant_id`, `enrollment_id`, `student_id`, `student_first_name`, `parent_id`, `class_name`, `title`, dan `reporter_id`."
        - Kedua endpoint hanya terdaftar di grup `/internal` dengan `InternalServiceAuth`, dan tidak ada route gateway baru.
        - ID tidak valid dijawab 400. Resource yang tidak ada atau sudah soft-deleted (termasuk report yang student-nya soft-deleted) dijawab 404 dengan envelope standar.
        - "Response tidak memuat field lain: tanpa catatan parent, email parent, skor, atau isi evaluasi report."
      acceptanceCriteria:
        - Request tanpa credential atau dengan credential salah ditolak 401 tanpa menyentuh database.
        - Dengan credential benar, kedua endpoint mengembalikan konteks yang sesuai untuk permintaan jadwal dan report yang ada.
        - Resource yang sudah soft-deleted dijawab 404.
        - Perilaku endpoint publik report dan permintaan jadwal tidak berubah.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: "Risiko utama: kebocoran data lintas tenant, karena endpoint internal ini tidak memfilter tenant. Chat-service wajib membandingkan `tenant_id` dan `parent_id` dengan token pemanggil (diatur di issue `chat-service-conversation-contexts`). Mitigasi di sisi academic adalah payload minimal dan credential wajib. Ikuti pola `ActivateInternal` (`internal/delivery/http/handler/enrollment_handler.go:390`). Nama field dan path di atas adalah kontrak untuk chat-service. Perbarui kelolakelas-docs `docs/api/academic.md` (bagian internal) dan `docs/api/endpoint-matrix.md`."
      relevantAreas:
        - kelolakelas-academic-service/cmd/server/routes.go
        - kelolakelas-academic-service/internal/delivery/http/handler
        - kelolakelas-academic-service/internal/delivery/http/middleware/auth_middleware.go
        - kelolakelas-academic-service/internal/usecase/private_schedule_request_usecase.go
        - kelolakelas-academic-service/internal/usecase/report_usecase.go
        - kelolakelas-academic-service/internal/repository
      edgeCases:
        - Permintaan jadwal berstatus `cancelled` atau `rejected` tetap dikembalikan beserta statusnya.
        - UUID valid tetapi milik jenis resource lain, misalnya ID report di endpoint schedule-request, dijawab 404.
        - Kelas terkait sudah di-unpublish; `class_name` tetap dikembalikan.
      testingValidation:
        - Handler test kedua endpoint untuk 401 (tanpa credential dan credential salah), 400, 404, dan 200.
        - Test bahwa response hanya memuat field yang ditentukan, sebagai mitigasi kebocoran data.
        - Route test bahwa kedua endpoint tidak terdaftar di luar `/internal`.
        - Existing tests pass, `gofmt`/`go vet`/`go test -race` pass, dan acceptance criteria diverifikasi.
      outOfScope:
        - Perubahan endpoint publik report atau permintaan jadwal.
        - Akses parent ke isi report.
        - Route gateway.
    labels:
      - academic
      - ai-ready
  - projectKey: tenant-parent-teacher-chat
    type: Feature
    priority: High
    externalDependencies: []
    draftKey: chat-service-core-api
    title: Chat-service menyimpan percakapan pengajar–admin tenant dan pesannya melalui REST API
    estimate: L
    complexity: high
    repositories:
      - chat
    blockedByDraftKeys:
      - chat-manage-permission
    body:
      backgroundProblem: |-
        Owner memutuskan (2026-09-28) bahwa chat dibangun sebagai service dan repo baru `kelolakelas-chat-service` dengan WebSocket. Operator membuat repo berisi kerangka Go dan CI `gate` sebelum issue ini diberi `ai-ready`, tetapi domain chat belum ada. Service lain menyediakan pola yang bisa diikuti:
        - JWT HS256 dengan `JWT_SECRET` bersama dan klaim `user_id`, `tenant_id`, `role_id`, `member_id`, `is_parent` (identity `pkg/jwt/jwt.go:17-29`, academic `internal/delivery/http/middleware/auth_middleware.go:26-92`);
        - cek permission lewat gRPC identity `/tenant.PermissionService/CheckPermission` (academic `pkg/grpcclient/permission_client.go`);
        - migration golang-migrate dan envelope `{status, message, data}`.
      goal: Anggota tenant dapat membuka satu percakapan dengan admin tenant. Anggota tersebut dan pemegang `chat:manage` di tenant yang sama dapat membaca, mengirim, dan menandai pesan terbaca lewat REST, dengan isolasi tenant yang teruji.
      requirements:
        - |-
          Schema PostgreSQL (migration golang-migrate) mencakup tiga tabel:
            - percakapan: `id`, `tenant_id`, `kind`, `subject_id`, `parent_user_id` (nullable), `member_user_id` (nullable), snapshot `context` jsonb, `created_by_user_id`, `created_at`, `last_message_at`, dengan unik (`tenant_id`, `kind`, `subject_id`);
            - pesan: `id`, `conversation_id`, `sender_user_id`, `sender_kind` (`parent`/`member`), `body`, `client_message_id`, `created_at`, dengan unik (`conversation_id`, `sender_user_id`, `client_message_id`);
            - status baca per pengguna per percakapan.
        - Autentikasi JWT mengikuti academic `AuthMiddleware`. Token tanpa `user_id`, atau token non-parent tanpa `tenant_id`, ditolak 401.
        - |-
          Endpoint berikut disediakan:
            - `GET /api/v1/chat/conversations`: percakapan yang boleh dilihat pemanggil, beserta pesan terakhir dan `unread_count`, dengan paginasi `page`/`page_size`;
            - `POST /api/v1/chat/conversations`: get-or-create, menjawab 201 bila baru dan 200 bila sudah ada;
            - `GET /api/v1/chat/conversations/:id`;
            - `GET /api/v1/chat/conversations/:id/messages`: pesan terbaru dulu, dengan paginasi `before` + `limit` (maksimum 100);
            - `POST /api/v1/chat/conversations/:id/messages`;
            - `POST /api/v1/chat/conversations/:id/read`.
        - Issue ini hanya mendukung `kind` `staff`. Anggota tenant membuat percakapannya sendiri (`subject_id` = `member_id` pemanggil); parent tidak dapat membuat `staff`.
        - Aturan visibilitas dipusatkan di satu fungsi yang nanti juga dipakai WebSocket. Percakapan `staff` terlihat oleh anggota pemiliknya (`member_user_id` = `user_id` pemanggil, tenant sama) dan oleh anggota tenant yang sama yang memiliki `chat:manage`, dicek lewat gRPC identity dengan `tenant_id`, `role_id`, dan `member_id`.
        - Percakapan yang tidak boleh dilihat dijawab 404, bukan 403, agar keberadaannya tidak bocor.
        - Isi pesan di-trim, wajib 1–2000 karakter, lalu disimpan dan dikembalikan sebagai teks biasa. `client_message_id` wajib, dan pengiriman ulang dengan nilai yang sama mengembalikan pesan yang sudah ada (idempoten).
        - Error 5xx disanitasi sehingga tidak membocorkan error database atau nama host.
        - "Konfigurasi lewat env yang didokumentasikan di `.env.example`: `DATABASE_URL`/`DB_*`, `JWT_SECRET`, `IDENTITY_GRPC_HOST`, `IDENTITY_PERMISSION_TIMEOUT_MS`, `PORT`, dan timeout server."
      acceptanceCriteria:
        - Anggota tenant membuat percakapan `staff` dan mengirim pesan, lalu pemegang `chat:manage` di tenant yang sama melihat percakapan itu di daftarnya dengan `unread_count` 1.
        - Setelah pemegang `chat:manage` membalas lalu memanggil `read`, `unread_count` miliknya menjadi 0.
        - Anggota lain tanpa `chat:manage`, anggota tenant lain, dan parent mendapat 404 untuk percakapan itu dan tidak melihatnya di daftar.
        - Membuat `staff` dua kali mengembalikan percakapan yang sama.
        - Pesan kosong, hanya berisi spasi, atau lebih dari 2000 karakter ditolak 400, dan `client_message_id` yang sama tidak menduplikasi pesan.
        - Bila gRPC identity tidak tersedia, pemeriksaan `chat:manage` gagal tertutup (akses ditolak).
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: |-
        Risiko utama: kebocoran pesan lintas tenant di service baru. Mitigasinya satu fungsi visibilitas yang dipakai semua handler (dan kelak fan-out WebSocket), ditambah integration test isolasi.

        Prasyarat Project yang dikerjakan operator: repo `kelolakelas-chat-service` dengan kerangka Go, CI `gate`, dan branch protection, serta `chat` sudah ada di kontrak orchestrator. Ikuti struktur academic: `cmd/server`, `cmd/migrate`, `internal/{config,domain,repository,usecase,delivery}`, dan `pkg/grpcclient`.

        Path endpoint di atas adalah kontrak untuk issue `gateway-chat-routes` dan `web-chat-inbox-realtime`, jadi jangan diubah tanpa memperbarui issue tersebut. Pada tahap ini chat-service berjalan satu instance. Nama tampilan pengirim di luar scope; response memuat `sender_user_id` dan `sender_kind`.

        Asumsi yang belum dikonfirmasi owner:
        - admin tenant adalah pemegang `chat:manage`;
        - pengajar adalah anggota tenant aktif mana pun;
        - percakapan `staff` hanya dimulai oleh anggota, bukan oleh admin.

        Perbarui kelolakelas-docs: `docs/components/chat-service.md` (baru), `docs/api/chat.md` (baru), `docs/data/chat-schema.md` (baru), `docs/reference/environment-variables.md`, `docs/reference/repository-map.md`, dan `docs/02-architecture.md`.
      relevantAreas:
        - kelolakelas-chat-service/cmd
        - kelolakelas-chat-service/internal
        - kelolakelas-chat-service/migrations
        - kelolakelas-academic-service/internal/delivery/http/middleware/auth_middleware.go
        - kelolakelas-academic-service/pkg/grpcclient/permission_client.go
      edgeCases:
        - Anggota dinonaktifkan atau role-nya diubah setelah percakapan dibuat. Permission dicek per request.
        - Dua request create `staff` bersamaan dari anggota yang sama menghasilkan satu percakapan lewat unique constraint.
        - Paginasi `before` memakai ID pesan dari percakapan lain.
        - Token parent (tenant nol) memanggil daftar percakapan dan menerima daftar kosong, bukan error.
      testingValidation:
        - Unit test usecase untuk aturan visibilitas, validasi pesan, dan idempotensi `client_message_id`.
        - Integration test PostgreSQL untuk isolasi tenant dan pemegang `chat:manage` sebagai mitigasi kebocoran lintas tenant, termasuk create bersamaan.
        - Handler test untuk 401, 404 tersembunyi, 400, dan fail-closed saat gRPC identity gagal.
        - CI `gate` pass (`gofmt`, `go vet`, `go test -race`, build, govulncheck), existing tests pass, dan acceptance criteria diverifikasi.
      outOfScope:
        - Percakapan `schedule_request` dan `report` (issue terpisah).
        - WebSocket dan tiket (issue terpisah).
        - Route gateway dan UI web.
        - Lampiran, edit, dan hapus pesan.
    labels:
      - chat
      - ai-ready
  - projectKey: tenant-parent-teacher-chat
    type: Feature
    priority: High
    externalDependencies: []
    draftKey: chat-service-conversation-contexts
    title: Chat-service mendukung percakapan parent–admin tenant per permintaan jadwal private dan pengajar–parent per report
    estimate: M
    complexity: high
    repositories:
      - chat
    blockedByDraftKeys:
      - chat-service-core-api
      - academic-chat-context-internal-api
    body:
      backgroundProblem: "Owner menetapkan dua alur: parent dapat chat dengan admin tenant saat mengajukan jadwal private, dan pengajar dapat chat dengan parent terkait report student. Hak akses keduanya hanya dapat dibuktikan dari data academic, yang disediakan lewat endpoint internal (issue `academic-chat-context-internal-api`). Parent tidak dapat membaca report lewat API publik (academic `internal/usecase/report_usecase.go:62` hanya menyediakan `GetByIDForTenant`)."
      goal: Parent dan admin tenant dapat membuka percakapan untuk satu permintaan jadwal private, dan pengajar dapat membuka percakapan dengan parent untuk satu report. Hak akses diverifikasi dari academic.
      requirements:
        - "`POST /api/v1/chat/conversations` menerima `kind` `schedule_request` dan `report`, dengan `subject_id` berupa ID permintaan atau ID report. Chat-service memanggil endpoint internal academic dengan `X-Internal-Service-Credential` (env `ACADEMIC_SERVICE_URL` dan `INTERNAL_SERVICE_CREDENTIAL`)."
        - "`schedule_request`: parent dapat membuat bila `parent_id` konteks sama dengan `user_id` token parent, dan anggota dengan `chat:manage` dapat membuat bila `tenant_id` konteks sama dengan tenant token. Percakapan terlihat oleh parent tersebut dan pemegang `chat:manage` di tenant itu."
        - "`report`: anggota dengan `report:read` di tenant report dapat membuat, sedangkan parent tidak dapat membuat. Percakapan terlihat oleh parent student (`parent_id` konteks) dan anggota tenant itu yang memiliki `report:read`."
        - "Snapshot konteks disimpan saat percakapan dibuat: `class_name`, `student_first_name`, `report_title` bila ada, dan nama tenant dari gRPC identity `GetTenantPublicInfo`. Dengan begitu daftar percakapan parent lintas tenant tetap informatif."
        - Parent (token tanpa tenant) melihat semua percakapan miliknya lintas tenant di `GET /api/v1/chat/conversations`.
        - Aturan visibilitas baru ditambahkan ke fungsi visibilitas yang sama dari issue `chat-service-core-api`. Visibilitas setelah pembuatan memakai kolom tersimpan, bukan panggilan ulang ke academic.
        - Bila academic tidak tersedia atau menjawab 5xx, pembuatan percakapan gagal dengan 503 tersanitasi; percakapan yang sudah ada tetap dapat dibaca.
      acceptanceCriteria:
        - Parent pemilik permintaan membuat percakapan `schedule_request`, dan pemegang `chat:manage` di tenant itu dapat membalas.
        - Parent lain, anggota tenant lain, dan anggota tanpa `chat:manage` tidak dapat membuat maupun melihat percakapan permintaan itu (404).
        - Pengajar dengan `report:read` membuat percakapan `report`, parent student melihat dan membalasnya, sedangkan parent lain mendapat 404.
        - Parent yang mencoba membuat percakapan `report` ditolak.
        - ID permintaan atau report yang tidak ada ditolak 404.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: |-
        Risiko utama: kebocoran lintas tenant dan lintas parent, karena endpoint internal academic tidak memfilter tenant. Chat-service wajib membandingkan `tenant_id` dan `parent_id` konteks dengan token sebelum membuat percakapan.

        Asumsi yang belum dikonfirmasi owner:
        - percakapan permintaan jadwal boleh dibuka pada status apa pun, termasuk setelah ditolak atau dibatalkan;
        - sisi tenant pada percakapan report adalah semua pemegang `report:read` di tenant, bukan hanya pembuat report.

        Perbarui kelolakelas-docs `docs/api/chat.md`, `docs/components/chat-service.md`, dan `docs/reference/environment-variables.md`.
      relevantAreas:
        - kelolakelas-chat-service/internal/usecase
        - kelolakelas-chat-service/internal/repository
        - kelolakelas-chat-service/pkg
        - kelolakelas-identity-service/pkg/proto/tenant
      edgeCases:
        - Permintaan dibatalkan setelah percakapan dibuat; percakapan tetap bisa dipakai.
        - Student dihapus setelah percakapan report dibuat; snapshot konteks tetap ditampilkan.
        - Parent memiliki percakapan di beberapa tenant.
        - Dua anggota tenant membuat percakapan yang sama secara bersamaan.
      testingValidation:
