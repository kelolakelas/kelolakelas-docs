      goal: Parent dapat mengajukan slot jadwal mingguan untuk kelas private bagi student miliknya. Tenant dapat melihat dan menolak ajuan, dengan atau tanpa alasan. Isolasi tenant dan kepemilikan student tetap terjaga.
      requirements:
        - Academic menyimpan permintaan jadwal private dengan tenant, kelas, student, parent, billing cycle (`monthly`/`quarterly`/`yearly`), satu atau lebih slot mingguan (`day_of_week` ISO 1–7, `start_time`, `end_time`), catatan parent opsional, status (`pending`, `approved`, `rejected`, `cancelled`), alasan penolakan opsional, serta waktu dibuat dan diputuskan.
        - Parent hanya dapat membuat permintaan untuk student miliknya, pada kelas bertipe `private` yang dipublikasikan dengan `enrollment_status` `open`. Kelas group ditolak.
        - Satu student hanya boleh memiliki satu permintaan `pending` per kelas, dan tidak boleh mengajukan bila sudah memiliki enrollment `pending` atau `active` di kelas tersebut.
        - Parent dapat melihat daftar dan detail permintaannya sendiri, serta membatalkan permintaan yang masih `pending`.
        - Anggota tenant dengan `enrollment:read` dapat melihat daftar (dengan filter status) dan detail permintaan milik tenant-nya. Anggota dengan `enrollment:update` dapat menolak permintaan `pending`, dengan alasan opsional.
        - Email parent dari klaim token terverifikasi disimpan pada permintaan agar invoice yang kelak dibuat tenant dapat dialamatkan, mengikuti pola KEL-75 di `internal/delivery/http/handler/enrollment_handler.go:198-201`.
        - Checkout langsung kelas private melalui `POST /catalog/classes/:class_id/enrollments` ditolak dengan `code` error yang dapat dibaca mesin dan mengarahkan ke permintaan jadwal. Checkout kelas group tidak berubah.
        - Semua route baru didaftarkan di gateway `internal/delivery/http/router.go` dengan autentikasi yang sama seperti route enrollment.
      acceptanceCriteria:
        - Parent membuat permintaan untuk student miliknya pada kelas private yang terbuka dan menerima 201 dengan status `pending`.
        - Permintaan untuk student milik parent lain, kelas group, kelas yang tidak dipublikasikan atau tidak `open`, atau slot dengan `end_time` tidak setelah `start_time` ditolak 4xx dengan pesan yang jelas.
        - Permintaan `pending` kedua untuk student dan kelas yang sama ditolak 409.
        - Anggota tenant A tidak dapat membaca, menolak, atau mengetahui keberadaan permintaan tenant B.
        - Tenant menolak dengan atau tanpa alasan, lalu parent melihat status `rejected` beserta alasannya bila ada.
        - Parent membatalkan permintaan `pending`, dan permintaan yang sudah diputuskan tidak dapat dibatalkan.
        - Checkout langsung kelas private ditolak dengan `code` terdokumentasi, sedangkan checkout kelas group tetap berhasil seperti sebelumnya.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: "Risiko utama: kebocoran data lintas tenant atau lintas parent, karena resource baru dibaca oleh dua persona. Ikuti scoping tenant dan `RequirePermissionUnlessParent` di academic `cmd/server/routes.go:65-70`, serta sanitasi 5xx (KEL-64). Tambahkan migration academic baru; format waktu mengikuti `ScheduleItemRequest` (`internal/domain/schedule_dto.go:10-20`). Keputusan owner (2026-09-28): (1) kelas private hanya dapat dibeli melalui permintaan jadwal yang disetujui tenant, dan checkout langsung dihapus; (2) tenant dapat menolak begitu saja atau menolak dengan rekomendasi jadwal lain. Rekomendasi dikerjakan di issue terpisah (`private-schedule-recommendation-api`); issue ini menyediakan penolakan dengan alasan opsional, dan parent tetap dapat mengajukan permintaan baru setelah ditolak. Persetujuan, invoice, UI, email, dan chat ada di luar issue ini. Perbarui kelolakelas-docs: `docs/api/academic.md`, `docs/api/endpoint-matrix.md`, `docs/api/gateway.md`, `docs/data/academic-schema.md`, dan `docs/flows/academic.md`."
      relevantAreas:
        - kelolakelas-academic-service/internal/domain
        - kelolakelas-academic-service/internal/usecase/enrollment_usecase.go
        - kelolakelas-academic-service/internal/repository
        - kelolakelas-academic-service/internal/delivery/http/handler
        - kelolakelas-academic-service/cmd/server/routes.go
        - kelolakelas-academic-service/migrations
        - kelolakelas-api-gateway/internal/delivery/http/router.go
      edgeCases:
        - Kelas di-unpublish atau ditutup saat permintaan masih `pending`.
        - Student dihapus saat permintaan masih `pending`.
        - Slot duplikat atau tumpang tindih dalam satu permintaan.
        - Parent membatalkan bersamaan dengan tenant menolak (race).
        - Token parent tanpa klaim email.
      testingValidation:
        - Unit test usecase untuk validasi, transisi status, dan aturan satu `pending` per student per kelas.
        - Integration test PostgreSQL untuk isolasi tenant dan kepemilikan student (mitigasi risiko lintas tenant).
        - Handler test untuk permission `enrollment:read`/`enrollment:update` serta akses parent.
        - Gateway route test untuk route baru.
        - Existing tests pass, `go vet`/lint pass, dan acceptance criteria diverifikasi.
      outOfScope:
        - Persetujuan permintaan beserta pembuatan enrollment, jadwal, dan invoice.
        - UI web parent dan tenant.
        - Notifikasi email atau chat.
        - Penolakan dengan rekomendasi jadwal lain (issue terpisah).
  - draftKey: approve-private-schedule-request
    projectKey: private-class-scheduled-purchase
    title: Persetujuan tenant atas permintaan jadwal private membuat enrollment, jadwal, dan payment link
    type: Feature
    priority: High
    estimate: M
    complexity: high
    labels:
      - academic
      - api-gateway
      - ai-ready
    repositories:
      - academic
      - api-gateway
    blockedByDraftKeys:
      - private-schedule-request-api
    externalDependencies: []
    body:
      backgroundProblem: Setelah permintaan jadwal private tersedia, tenant perlu mengubah permintaan yang disetujui menjadi pembelian yang dapat dibayar. Academic sudah mampu membuat enrollment `pending` beserta invoice billing (`internal/usecase/enrollment_usecase.go:331` `EnrollStudent`, `pkg/billing/client.go` `GenerateInvoice`) dan membuat jadwal private terikat `enrollment_id` (`internal/usecase/schedule_usecase.go:221-239`). Billing juga sudah mengaktifkan enrollment setelah pembayaran melalui `/internal/enrollments/:id/activate` (`cmd/server/routes.go:94`). Namun belum ada operasi yang menyatukan langkah-langkah tersebut dari sebuah permintaan.
      goal: Anggota tenant dengan izin menyetujui permintaan `pending`, dan sistem menghasilkan enrollment `pending`, jadwal private sesuai slot yang disetujui, serta payment link yang dapat dibayar parent. Setelah pembayaran terkonfirmasi, enrollment aktif dengan jadwal tersebut.
      requirements:
        - Anggota tenant dengan `enrollment:update` dapat menyetujui permintaan `pending` milik tenant-nya.
        - Persetujuan mengubah status permintaan menjadi `approved`, membuat satu enrollment `pending` untuk student, kelas, dan billing cycle dari permintaan, serta membuat jadwal private per slot yang terikat enrollment tersebut dengan kapasitas 1.
        - Invoice dibuat melalui `GenerateInvoice` billing yang ada dengan idempotency key yang diturunkan dari permintaan dan email parent yang tersimpan. Checkout URL disimpan pada enrollment dengan cara yang sama seperti `EnrollPublic`.
        - Respons persetujuan memuat enrollment id, transaction id, dan `checkout_session_url` agar tenant dapat membagikannya.
        - "Persetujuan berulang untuk permintaan yang sama idempoten: tidak membuat enrollment, jadwal, atau invoice ganda, dan mengembalikan hasil yang sama."
        - Kegagalan invoice mengikuti jalur `invoiceFailure` yang ada (termasuk `platform_fee_exceeds_gross`, KEL-106) dan tidak meninggalkan permintaan `approved` tanpa enrollment yang dapat dibayar. Tenant dapat mencoba lagi.
        - Aktivasi setelah pembayaran dan pelepasan saat invoice kedaluwarsa memakai jalur internal yang ada tanpa perubahan billing.
      acceptanceCriteria:
        - Menyetujui permintaan `pending` menghasilkan enrollment `pending`, jadwal private sesuai slot, dan `checkout_session_url` yang valid.
        - Parent melihat enrollment baru beserta tautan "Lanjutkan pembayaran" di halaman status enrollment yang ada (KEL-53).
        - Setelah webhook pembayaran terkonfirmasi, enrollment menjadi `active` dan sesi dihasilkan dari jadwal yang disetujui.
        - Persetujuan kedua atau paralel untuk permintaan yang sama tidak membuat data ganda.
        - Permintaan milik tenant lain, permintaan yang tidak `pending`, dan anggota tanpa `enrollment:update` ditolak dengan 404/409/403 yang sesuai.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: "Risiko utama: financial correctness dan idempotensi. Persetujuan ganda atau parsial dapat menghasilkan invoice ganda atau enrollment tanpa jadwal. Jaga penulisan permintaan, enrollment, dan jadwal dalam satu transaksi database, dan jangan menahan lock database selama I/O ke billing (pola `EnrollPublic` di `enrollment_usecase.go:168-240`). Pakai ulang `CreateIfCapacityAvailable` dan penanganan duplikat enrollment (KEL-54). Tidak ada perubahan billing. Route persetujuan harus didaftarkan di gateway. Perbarui kelolakelas-docs: `docs/api/academic.md`, `docs/flows/academic.md`, dan `docs/flows/billing-and-subscriptions.md` untuk alur private."
      relevantAreas:
        - kelolakelas-academic-service/internal/usecase/enrollment_usecase.go
        - kelolakelas-academic-service/internal/usecase/schedule_usecase.go
        - kelolakelas-academic-service/pkg/billing/client.go
        - kelolakelas-academic-service/cmd/server/routes.go
        - kelolakelas-api-gateway/internal/delivery/http/router.go
      edgeCases:
        - Billing menolak invoice karena biaya platform melebihi gross (KEL-106).
        - Billing timeout setelah enrollment dibuat.
        - Student sudah memiliki enrollment aktif di kelas yang sama saat disetujui.
        - Kelas ditutup di antara pengajuan dan persetujuan.
        - Invoice kedaluwarsa sebelum dibayar, sehingga enrollment dilepas oleh jalur yang ada.
      testingValidation:
        - Unit test usecase untuk persetujuan sukses, kegagalan invoice, dan replay idempoten.
        - Integration test PostgreSQL untuk persetujuan paralel yang tidak menghasilkan data ganda (mitigasi risiko finansial).
        - Test isolasi tenant dan permission untuk handler persetujuan.
        - Gateway route test.
        - Existing tests pass, `go vet`/lint pass, dan acceptance criteria diverifikasi.
      outOfScope:
        - Pengiriman payment link lewat email atau chat.
        - Perubahan billing atau provider pembayaran.
        - UI web.
  - draftKey: parent-private-schedule-request-web
    projectKey: private-class-scheduled-purchase
    title: Parent mengajukan jadwal kelas private dari detail kelas dan memantau status permintaannya
    type: Feature
    priority: High
    estimate: M
    complexity: medium
    labels:
      - web
      - ai-ready
    repositories:
      - web
    blockedByDraftKeys:
      - private-schedule-request-api
    externalDependencies: []
    body:
      backgroundProblem: Panel enrollment di detail kelas (`app/(public)/kelas/[id]/_components/EnrollmentPanel.tsx`) menampilkan form checkout yang sama untuk kelas private dan group. Setelah API permintaan jadwal tersedia dan checkout langsung kelas private ditolak, parent membutuhkan UI untuk mengajukan jadwal dan mengikuti hasil peninjauan.
      goal: Parent dapat mengajukan satu atau lebih slot jadwal untuk kelas private langsung dari detail kelas, lalu melihat status permintaan, alasan penolakan bila ada, dan kelanjutan pembayaran setelah disetujui.
      requirements:
        - "Untuk kelas private dan pengguna parent, panel detail kelas menampilkan form permintaan jadwal: student, periode pembayaran, satu atau lebih slot (hari, jam mulai, jam selesai), dan catatan opsional. Form checkout kelas private tidak lagi ditampilkan."
        - Kelas group tetap memakai form checkout yang ada tanpa perubahan.
        - Parent dapat melihat daftar permintaannya dengan status, slot, dan alasan penolakan bila ada, serta membatalkan permintaan `pending`.
        - Permintaan yang disetujui mengarahkan parent ke enrollment terkait di halaman status enrollment yang ada, tempat tautan pembayaran sudah tersedia (KEL-53).
        - Error API (409 permintaan ganda, 4xx validasi, 403, error jaringan) ditampilkan dengan pesan berbahasa Indonesia yang jelas.
      acceptanceCriteria:
        - Parent pada kelas private melihat form permintaan jadwal, bukan tombol "Lanjut ke pembayaran".
        - Mengirim permintaan valid menampilkan konfirmasi, dan permintaan muncul dengan status menunggu peninjauan.
        - Slot dengan jam selesai tidak setelah jam mulai ditolak di form sebelum request dikirim.
        - Permintaan ganda menampilkan pesan bahwa permintaan sebelumnya masih menunggu.
        - Permintaan yang ditolak menampilkan alasan dari tenant bila ada, beserta opsi mengajukan ulang.
        - Kelas group tetap berfungsi seperti sebelumnya.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: Ikuti pola Server Action dan `useActionState` di `app/(public)/kelas/[id]/_actions/actions.ts`, serta penanganan gateway di `lib/gateway.ts`. Kontrak endpoint mengikuti hasil issue API permintaan jadwal. Jangan mengarang field di luar kontrak tersebut. Hari memakai ISO 1–7 dengan label bahasa Indonesia, konsisten dengan `enrollmentScheduleLabel` (KEL-70). Perbarui kelolakelas-docs `docs/components/web.md`.
      relevantAreas:
        - kelolakelas-web/app/(public)/kelas/[id]/_components/EnrollmentPanel.tsx
        - kelolakelas-web/app/(public)/kelas/[id]/_actions/actions.ts
        - kelolakelas-web/app/(dashboard)/dashboard/parent/enrollments
        - kelolakelas-web/lib
      edgeCases:
        - Parent belum memiliki student.
        - Kelas ditutup saat form sedang diisi.
        - Sesi login kedaluwarsa saat submit.
        - Permintaan disetujui tetapi invoice gagal dibuat.
      testingValidation:
        - Vitest untuk render form private versus group, validasi slot, dan pemetaan error.
        - Test daftar permintaan untuk status pending, rejected, approved, dan cancelled.
        - Existing tests pass, `npm run lint` pass, type check/`next build` pass, dan acceptance criteria diverifikasi manual.
      outOfScope:
        - Perubahan API academic.
        - Chat atau email.
        - Halaman tenant.
        - Menampilkan dan menerima rekomendasi jadwal dari tenant (issue terpisah).
  - draftKey: tenant-private-schedule-review-web
    projectKey: private-class-scheduled-purchase
    title: Tenant meninjau, menyetujui, atau menolak permintaan jadwal private dari dashboard
    type: Feature
    priority: High
    estimate: M
    complexity: medium
    labels:
      - web
      - ai-ready
    repositories:
      - web
    blockedByDraftKeys:
      - approve-private-schedule-request
    externalDependencies: []
    body:
      backgroundProblem: Dashboard tenant memiliki halaman enrollments (`app/(dashboard)/dashboard/tenant/enrollments`) tetapi tidak memiliki tempat untuk permintaan jadwal private. Tanpa UI, API peninjauan dan persetujuan tidak dapat dipakai tenant. Chat dan email payment link belum tersedia, sehingga tenant juga membutuhkan cara membagikan payment link secara manual.
      goal: Anggota tenant yang berizin dapat melihat permintaan jadwal private, menyetujui atau menolaknya dengan alasan opsional, dan menyalin payment link hasil persetujuan.
      requirements:
        - Dashboard tenant menampilkan daftar permintaan jadwal private dengan filter status, nama student, kelas, slot yang diminta, periode pembayaran, catatan parent, dan waktu pengajuan.
        - Aksi setujui memakai dialog konfirmasi. Setelah berhasil, UI menampilkan payment link beserta tombol salin dan batas waktu bila tersedia.
        - Aksi tolak memakai dialog konfirmasi dengan alasan opsional.
        - Anggota tanpa `enrollment:read` melihat pesan izin, dan aksi disembunyikan atau ditolak dengan pesan jelas untuk anggota tanpa `enrollment:update`.
        - State loading, kosong, dan error API ditampilkan dengan jelas.
      acceptanceCriteria:
        - Permintaan `pending` milik tenant tampil beserta detail slotnya.
        - Menyetujui permintaan menampilkan payment link yang dapat disalin, dan status berubah menjadi disetujui.
        - Menolak dengan atau tanpa alasan mengubah status menjadi ditolak.
        - Member tanpa izin melihat pesan izin, bukan error teknis.
        - Existing functionality remains unaffected
        - Error and validation scenarios are handled correctly
      technicalNotes: Ikuti pola dialog yang dapat diakses di `app/(dashboard)/dashboard/tenant/roles/_components/RoleEditModal.tsx` dan pola tabel di `tenant/enrollments/_components/EnrollmentTable.tsx`. Kontrak endpoint mengikuti hasil issue API permintaan jadwal dan persetujuan. Payment link hanya ditampilkan bila skemanya http/https, mengikuti `resumePayment` di `lib/payment-status.ts`. Perbarui kelolakelas-docs `docs/components/web.md`.
      relevantAreas:
        - kelolakelas-web/app/(dashboard)/dashboard/tenant/enrollments
        - kelolakelas-web/app/(dashboard)/dashboard/tenant/_constants/constants.ts
        - kelolakelas-web/lib/payment-status.ts
      edgeCases:
        - Permintaan sudah dibatalkan parent saat tenant membuka dialog.
        - Persetujuan gagal karena biaya platform melebihi pembayaran (KEL-106).
        - Dua anggota tenant memproses permintaan yang sama bersamaan.
      testingValidation:
        - Vitest untuk daftar, dialog setujui, dialog tolak dengan dan tanpa alasan, serta pemetaan 403/409.
        - Existing tests pass, `npm run lint` pass, type check/`next build` pass, dan acceptance criteria diverifikasi manual.
      outOfScope:
        - Pengiriman payment link lewat email atau chat.
        - Menolak dengan rekomendasi jadwal lain (issue terpisah).
        - Perubahan API.
