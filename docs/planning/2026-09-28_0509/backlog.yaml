  - draftKey: weekly-schedule-slot-generator
    projectKey: null
    title: Tenant dapat menghasilkan slot jadwal mingguan dari pilihan hari, jam, lama sesi, dan jeda
    type: Feature
    priority: Medium
    estimate: M
    complexity: medium
    labels: [web, ai-ready]
